name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.18.1'
  PNPM_VERSION: '9.15.4'

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:cov

      - name: Build
        run: pnpm build

      - name: API e2e tests
        run: pnpm --filter @quickpick/api test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: '**/coverage/lcov.info'
          if-no-files-found: ignore

  migrations:
    name: migrations apply to an empty database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # PostGIS is part of the schema (branch/address geography columns).
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: quickpick
          POSTGRES_PASSWORD: quickpick
          POSTGRES_DB: quickpick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quickpick" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://quickpick:quickpick@localhost:5432/quickpick
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The seed script imports the shared role catalogue from its build output.
      - name: Build shared package
        run: pnpm --filter @quickpick/shared build

      - name: Validate schema
        run: pnpm --filter @quickpick/api exec prisma validate

      - name: Apply migrations
        run: pnpm --filter @quickpick/api db:migrate

      - name: Seed roles and permissions (twice, to prove idempotence)
        run: |
          pnpm --filter @quickpick/api db:seed
          pnpm --filter @quickpick/api db:seed

  docker:
    name: api image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
